# =============================================================================
# VarshaNetra — Master Configuration
# =============================================================================

project:
  name: "VarshaNetra"
  description: "AI/ML Heavy Rainfall Early-Warning & Inundation Prediction System"
  seed: 42
  device: "cuda"          # falls back to "cpu" automatically if unavailable

grid:
  resolution_km: 1.0
  region_bbox: [68.0, 8.0, 97.5, 37.0]   # [min_lon, min_lat, max_lon, max_lat] — India
  crs: "EPSG:4326"

time:
  base_timestep_minutes: 30
  history_windows_minutes: [30, 60, 180, 360, 720, 1440]   # 30m,1h,3h,6h,12h,24h
  rainfall_lead_hours: [1, 3, 6, 12, 24, 48, 72]
  flood_lead_hours: [1, 3, 6, 12, 24, 48]

splits:
  # Chronological split — never randomize across time to avoid leakage.
  train: ["2015-01-01", "2022-12-31"]
  validation: ["2023-01-01", "2023-12-31"]
  test: ["2024-01-01", "2025-12-31"]
  extreme_event_holdout:
    description: "Named extreme events fully withheld from train/val, used only for final testing."
    events:
      - {name: "2018_Kerala_floods", start: "2018-08-08", end: "2018-08-22"}
      - {name: "2020_Hyderabad_floods", start: "2020-10-13", end: "2020-10-15"}
      - {name: "2021_Chennai_floods", start: "2021-11-05", end: "2021-11-11"}

rainfall_categories:  # IMD scale, sub-daily adjusted (mm / accumulation window)
  - {name: "No Rain",        min: 0.0,   max: 2.5}
  - {name: "Light",          min: 2.5,   max: 15.5}
  - {name: "Moderate",       min: 15.6,  max: 64.4}
  - {name: "Heavy",          min: 64.5,  max: 115.5}
  - {name: "Very Heavy",     min: 115.6, max: 204.4}
  - {name: "Extremely Heavy",min: 204.5, max: 100000.0}

features:
  satellite:
    - ir1_brightness_temp
    - ir2_brightness_temp
    - wv_brightness_temp
    - cloud_top_temp
    - cloud_top_height_km
    - olr
    - cmv_u
    - cmv_v
    - insat_qpe_mm
    - imerg_precip_mm
  radar:
    - reflectivity_dbz
    - radial_velocity_ms
    - spectral_width
    - echo_top_height_km
    - vil_kg_m2
    - radar_rainfall_rate_mmhr
  ground:
    - gauge_rainfall_mm
    - temperature_c
    - relative_humidity_pct
    - wind_speed_ms
    - wind_dir_deg
    - pressure_hpa
    - soil_moisture_pct
    - river_stage_m
  nwp:
    - precip_forecast_mm
    - temperature_c_nwp
    - rh_pct_nwp
    - u_wind_925hpa
    - v_wind_925hpa
    - cape_j_kg
    - cin_j_kg
    - vertical_velocity
    - geopotential_500hpa
  static:
    - elevation_m
    - slope_deg
    - lulc_class
    - soil_type
    - distance_to_river_m
    - drainage_density
    - historical_flood_freq

thermo_wind:
  cold_cloud_threshold_k: 235.0          # standard convective cold-cloud threshold
  extra_thresholds_k: [220.0, 208.0]
  enabled_interactions:
    - "cooling_rate_x_wind_speed"
    - "cooling_rate_x_convergence"
    - "cold_cloud_fraction_x_convergence"
    - "cloud_top_temp_x_wind_speed"
    - "thermal_gradient_x_wind_dir"
    - "thermal_anomaly_x_convergence"
    - "cloud_motion_dir_x_wind_dir"

model:
  embed_dim: 128
  fusion:
    type: "cross_attention_gating"
    num_heads: 4
    dropout: 0.1
  encoders:
    satellite:
      type: "conv_lstm"
      in_channels: 10
      hidden_channels: 32
      seq_len: 5           # T-120,T-90,T-60,T-30,T
    radar:
      type: "conv_lstm"
      in_channels: 6
      hidden_channels: 32
      seq_len: 5
    meteorology:
      type: "transformer"
      in_features: 8
      hidden: 64
      n_layers: 2
      n_heads: 4
    nwp:
      type: "transformer"
      in_features: 9
      hidden: 64
      n_layers: 2
      n_heads: 4
    static:
      type: "mlp"
      in_features: 7
      hidden: 64

loss_weights:      # lambda_1..6, tuned on validation set (starting values)
  rain_regression: 1.0
  rain_classification: 1.0
  heavy_rain_probability: 0.5   # separate binary head from rain_classification (Section 1)
  flood_classification: 1.0
  inundation_depth: 1.0
  flood_segmentation: 1.0

class_imbalance:
  strategy: ["focal_loss", "class_weighting", "event_aware_sampling", "balanced_minibatches"]
  focal_gamma: 2.0
  min_positive_fraction_per_batch: 0.25

uncertainty:
  method: "mc_dropout"          # options: mc_dropout | deep_ensemble | quantile_regression
  mc_dropout_passes: 20
  ensemble_size: 5
  quantiles: [0.1, 0.5, 0.9]

warning_engine:
  # Calibrated against validation-set event statistics — NOT hard-coded blindly.
  default_thresholds:
    yellow: 0.30
    orange: 0.60
    red: 0.85
  calibration_method: "precision_recall_operating_point"

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001
  early_stopping_patience: 8
  stages:
    - "weather_nwp_baseline"
    - "add_satellite"
    - "add_radar"
    - "add_thermographic"
    - "add_wind_patterns"
    - "add_thermo_wind_interactions"
    - "add_flood_module"
    - "add_uncertainty"
    - "add_explainability"
    - "realtime_deployment"

paths:
  raw_data_dir: "data_samples/raw"
  processed_data_dir: "data_samples/processed"
  checkpoint_dir: "checkpoints"
  outputs_dir: "outputs"
